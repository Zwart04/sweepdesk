[package]
name = "sweepdesk"
version = "0.6.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Software inventory and reviewed uninstall for Linux desktops"

[[bin]]
name = "sweepdesk"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "fira-sans", "image", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
trash = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
