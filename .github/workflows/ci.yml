name: Debian and Ubuntu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bullseye
          - debian:bookworm
          - debian:trixie
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    steps:
      - name: Install test dependencies in the disposable container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "${{ matrix.image }}" = "debian:bullseye" ]; then
            sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list
          fi
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 librsvg2-common xvfb xauth desktop-file-utils
      - uses: actions/checkout@v4
      - name: Backend, isolated pip uninstall, and native UI checks
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: Validate desktop launcher and build portable/deb artifacts
        run: |
          desktop-file-validate sweepdesk.desktop
          python3 scripts/build.py
          dpkg-deb --info dist/sweepdesk_*_all.deb
          cd dist
          sha256sum -c SHA256SUMS
