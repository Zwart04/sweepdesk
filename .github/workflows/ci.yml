name: Debian and Ubuntu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm
          - debian:trixie
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    steps:
      - name: Install build tools in the disposable container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3 dpkg-dev desktop-file-utils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Validate desktop launcher and build portable/deb artifacts
        run: |
          desktop-file-validate sweepdesk.desktop
          python3 scripts/build.py
          dpkg-deb --info dist/sweepdesk_*_amd64.deb
          ./rust/target/release/sweepdesk --scan | head -3
          cd dist
          sha256sum -c SHA256SUMS
