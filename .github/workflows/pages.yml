name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/sweepdesk.svg', 'docs/screenshot.png', 'docs/settings.png', 'docs/screenshot-id.png', 'docs/settings-id.png', 'scripts/prepare_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static website
        run: python3 scripts/prepare_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .work/site-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
