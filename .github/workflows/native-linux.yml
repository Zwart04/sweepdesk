name: Native Linux packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            family: fedora
          - image: opensuse/tumbleweed:latest
            family: suse
          - image: archlinux:base
            family: arch
    steps:
      - uses: actions/checkout@v4
      - name: Build, install, and run the native package
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
        run: |
          docker run --rm -e SWEEPDESK_DISPOSABLE_CI=1 -e FAMILY -v "$PWD:/workspace" -w /workspace "$IMAGE" sh -ec '
            case "$FAMILY" in
              fedora)
                dnf -y install python3 git rust cargo rpm-build desktop-file-utils shadow-utils
                ;;
              suse)
                zypper --non-interactive refresh
                zypper --non-interactive install python3 git rust cargo rpm-build desktop-file-utils shadow
                ;;
              arch)
                pacman -Syu --noconfirm python git rust cargo base-devel desktop-file-utils shadow
                ;;
            esac
            cat /etc/os-release
            desktop-file-validate sweepdesk.desktop
            python3 scripts/ci_native.py
          '
      - uses: actions/upload-artifact@v4
        if: matrix.family == 'fedora' || matrix.family == 'suse' || matrix.family == 'arch'
        with:
          name: native-${{ matrix.family }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error
